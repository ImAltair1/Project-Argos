[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-argos"
version = "0.1.0"
description = "A personal media tracking application"
requires-python = ">=3.14"
dependencies = [
    "PySide6",
]

[tool.setuptools.packages.find]
where = ["src"]